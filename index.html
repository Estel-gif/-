<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>像素酒馆：开始你的特调</title>
    <!-- 建议后续替换为像素字体 -->
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        /* ========== 全局与背景样式 (保持原有纸质复古感) ========== */
        body {
            background-color: #e5d8c5;
            background-image: repeating-linear-gradient(45deg, #d3c4b1 25%, transparent 25%, transparent 75%, #d3c4b1 75%, #d3c4b1), repeating-linear-gradient(45deg, #d3c4b1 25%, #e5d8c5 25%, #e5d8c5 75%, #d3c4b1 75%, #d3c4b1);
            background-position: 0 0, 10px 10px;
            background-size: 20px 20px;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: #4a3e3d;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            background-color: #fcf5e3;
            width: 100%;
            max-width: 400px;
            border: 2px solid #e0d5c1;
            padding: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            position: relative;
        }

        /* ========== 选料区样式 ========== */
        #selection-section {
            text-align: center;
            padding: 20px 0;
        }
        .section-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .section-subtitle {
            font-size: 0.9rem;
            color: #887a77;
            margin-bottom: 20px;
        }

        /* 配料网格布局 */
        .ingredients-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }
        
        .ingredient-btn {
            background-color: #fff;
            border: 2px solid #e0d5c1;
            border-radius: 8px;
            padding: 10px 5px;
            cursor: pointer;
            font-size: 0.9rem;
            color: #4a3e3d;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        
        .ingredient-btn.selected {
            background-color: #f3b9c5; /* 选中后的粉色 */
            color: white;
            border-color: #f3b9c5;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
        }

        .ingredient-icon {
            font-size: 1.5rem;
        }

        /* 调酒按钮 */
        .mix-btn {
            background-color: #4a3e3d;
            color: #fcf5e3;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 0 #2a2221;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .mix-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #2a2221;
        }

        /* 重新开始按钮 */
        .restart-btn {
            background-color: transparent;
            color: #887a77;
            border: 1px dashed #887a77;
            padding: 10px;
            width: 100%;
            margin-top: 15px;
            cursor: pointer;
            font-size: 1rem;
        }

        /* ========== 结果页样式 (与原版基本一致) ========== */
        #result-section {
            display: none;
        }
        .mood-badge {
            position: absolute;
            top: -10px;
            right: -10px;
            background-color: #f8eeb9;
            padding: 10px 15px;
            border-radius: 8px;
            border: 2px solid #e0d5c1;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.05);
            font-weight: bold;
            text-align: center;
        }
        .drink-display {
            background-color: #f3b9c5;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            border: 2px solid #e0d5c1;
        }
        .pixel-drink {
            width: 40px;
            height: 80px;
            background: linear-gradient(to bottom, transparent 20%, #a8d8e6 20%, #a8d8e6 80%, #4a3e3d 80%), linear-gradient(to right, #4a3e3d 20%, transparent 20%, transparent 80%, #4a3e3d 80%);
            border: 4px solid #4a3e3d;
            position: relative;
        }
        .pixel-drink::after {
            content: ''; position: absolute; bottom: -20px; left: 10px; width: 12px; height: 20px; background-color: #4a3e3d;
        }
        .pixel-drink::before {
            content: ''; position: absolute; bottom: -28px; left: -10px; width: 52px; height: 8px; background-color: #4a3e3d;
        }
        .result-title { text-align: center; font-size: 1.8rem; margin: 10px 0 5px 0; font-weight: 900; }
        .result-subtitle { text-align: center; font-size: 1rem; color: #887a77; margin-bottom: 20px; }
        .result-desc { font-size: 0.95rem; line-height: 1.8; text-align: justify; margin-bottom: 20px; }
        .quote { font-style: italic; color: #887a77; text-align: center; margin: 20px 0; padding: 0 20px; position: relative; }
        .quote::before { content: '“'; font-size: 3rem; color: #e0d5c1; position: absolute; left: 0; top: -10px; font-family: serif; }
        
        .recipe-box { background-color: #f7eedb; border: 1px solid #e0d5c1; padding: 15px; margin-top: 30px; position: relative; }
        .recipe-box-title { font-weight: bold; margin-bottom: 10px; border-bottom: 1px dashed #d1c5b0; padding-bottom: 5px; }
        .tape { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 60px; height: 20px; background-color: rgba(245, 230, 140, 0.7); }
        .recipe-item { display: inline-block; background-color: #fff; border: 1px solid #e0d5c1; padding: 4px 8px; font-size: 0.85rem; margin: 4px 4px 4px 0; border-radius: 2px; }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- === 1. 选料页面 === -->
        <div id="selection-section">
            <div class="section-title">你的吧台</div>
            <div class="section-subtitle">请选择配料（至少选2样）</div>
            
            <div class="ingredients-grid" id="ingredients-container">
                <!-- 配料按钮由JS动态生成 -->
            </div>

            <button class="mix-btn" onclick="shakeDrink()">摇酒 (MIX!)</button>
        </div>

        <!-- === 2. 结果页面 === -->
        <div id="result-section">
            <div class="mood-badge">
                顾客心情<br>
                <div id="mood-icons">☕ ☕</div>
            </div>

            <div class="drink-display">
                <div class="pixel-drink" id="drink-img"></div>
            </div>

            <h1 id="res-title" class="result-title">加载中...</h1>
            <div id="res-subtitle" class="result-subtitle">加载中...</div>
            <p id="res-desc" class="result-desc"></p>
            <div id="res-quote" class="quote"></div>

            <div class="recipe-box">
                <div class="tape"></div>
                <div class="recipe-box-title">实际投入配料</div>
                <div id="res-recipe">
                    <!-- 玩家选中的配料会展示在这里 -->
                </div>
            </div>

            <button class="restart-btn" onclick="resetGame()">再调一杯</button>
        </div>

    </div>

    <script>
        // === 1. 吧台配料库 (可以无限添加) ===
        const allIngredients = [
            { id: 'vodka', name: '伏特加', icon: '🍶' },
            { id: 'gin', name: '金酒', icon: '🍾' },
            { id: 'rum', name: '朗姆酒', icon: '🥃' },
            { id: 'mint', name: '薄荷叶', icon: '🌿' },
            { id: 'salt', name: '海盐', icon: '🧂' },
            { id: 'ice', name: '冰块', icon: '🧊' },
            { id: 'soda', name: '苏打水', icon: '🫧' },
            { id: 'lemon', name: '柠檬', icon: '🍋' }
        ];

        let selectedIngredients = []; // 记录玩家选中的配料ID

        // === 2. 特调配方字典 (核心玩法) ===
        // 只有当玩家选的配料【完全包含】配方要求的配料时，才能调出对应酒款。
        const cocktailRecipes = [
            {
                required: ['vodka', 'gin', 'salt', 'mint'], // 必须包含这四个
                title: "咸冰实验特调",
                subtitle: "缀薄荷",
                mood: "😍😍",
                desc: "液体在舌尖构建了一座迷宫。伏特加、金酒交替出现，层层递进。海盐的咸味提升了整体的甜度，带来海洋的气息。翠绿的薄荷叶点缀其间，带来一丝草本清香。",
                quote: "这不仅仅是一杯饮料，这是一场微型冒险。",
                bgColor: "#f3b9c5" // 背景色可以单独配置
            },
            {
                required: ['rum', 'mint', 'soda'], 
                title: "经典莫吉托",
                subtitle: "清凉一夏",
                mood: "😎😎",
                desc: "朗姆酒的烈性被捣碎的薄荷叶与气泡水完美中和。这是夏日海滩上的标配，清爽解腻，让人仿佛听到了海浪的声音。",
                quote: "海风的味道，装在杯子里。",
                bgColor: "#a8e6cf" 
            },
            {
                required: ['gin', 'lemon', 'soda'], 
                title: "金菲士",
                subtitle: "酸甜气泡",
                mood: "🥰🥰",
                desc: "金酒的杜松子香气与新鲜柠檬汁碰撞，加上苏打水的充盈气泡，口感轻盈顺滑，非常适合作为餐前开胃酒。",
                quote: "像是在云朵上跳舞。",
                bgColor: "#ffdfd3" 
            }
        ];

        // 默认保底配方 (如果瞎乱选，就出这个)
        const mysterySludge = {
            title: "可疑的液体",
            subtitle: "黑暗料理",
            mood: "🤢😡",
            desc: "你把一堆不相干的材料混在了一起。它的颜色呈现出一种难以名状的混沌，散发着危险的气息。顾客看着这杯东西，陷入了沉思。",
            quote: "真正的勇士，敢于直面奇怪的调酒师。",
            bgColor: "#787a77" 
        };

        // === 3. 游戏逻辑 ===
        const containerEl = document.getElementById('ingredients-container');

        // 初始化：渲染所有配料按钮
        function initIngredients() {
            containerEl.innerHTML = '';
            allIngredients.forEach(ing => {
                const btn = document.createElement('div');
                btn.className = 'ingredient-btn';
                btn.innerHTML = `<div class="ingredient-icon">${ing.icon}</div><div>${ing.name}</div>`;
                
                // 点击选择/取消选择
                btn.onclick = () => {
                    if (selectedIngredients.includes(ing.id)) {
                        // 如果已选中，则取消选中
                        selectedIngredients = selectedIngredients.filter(id => id !== ing.id);
                        btn.classList.remove('selected');
                    } else {
                        // 如果没选中，加入数组
                        selectedIngredients.push(ing.id);
                        btn.classList.add('selected');
                    }
                };
                containerEl.appendChild(btn);
            });
        }

        // 摇酒按钮逻辑：检查配方
        function shakeDrink() {
            if (selectedIngredients.length < 2) {
                alert("老板，至少加两样配料再摇吧！");
                return;
            }

            // 1. 匹配配方
            let matchedRecipe = mysterySludge; // 默认是黑暗料理
            
            for (let recipe of cocktailRecipes) {
                // 判断玩家选的配料里，是否包含了该配方要求的所有配料
                const isMatch = recipe.required.every(reqId => selectedIngredients.includes(reqId));
                if (isMatch) {
                    matchedRecipe = recipe;
                    break; // 匹配到第一个符合的配方就停止
                }
            }

            // 2. 渲染结果页
            document.getElementById('res-title').innerText = matchedRecipe.title;
            document.getElementById('res-subtitle').innerText = matchedRecipe.subtitle;
            document.getElementById('res-desc').innerText = matchedRecipe.desc;
            document.getElementById('res-quote').innerText = matchedRecipe.quote;
            document.getElementById('mood-icons').innerText = matchedRecipe.mood;
            document.querySelector('.drink-display').style.backgroundColor = matchedRecipe.bgColor;

            // 渲染底部玩家实际选择的配料标签
            const recipeBox = document.getElementById('res-recipe');
            recipeBox.innerHTML = '';
            selectedIngredients.forEach(id => {
                // 查找配料的中文名
                const ingData = allIngredients.find(item => item.id === id);
                if (ingData) {
                    recipeBox.innerHTML += `<span class="recipe-item">${ingData.icon} ${ingData.name}</span>`;
                }
            });

            // 3. 切换页面显示
            document.getElementById('selection-section').style.display = 'none';
            document.getElementById('result-section').style.display = 'block';
        }

        // 重新开始游戏
        function resetGame() {
            selectedIngredients = []; // 清空选中数据
            initIngredients(); // 重新渲染未选中的按钮
            document.getElementById('selection-section').style.display = 'block';
            document.getElementById('result-section').style.display = 'none';
        }

        // 启动游戏
        initIngredients();
    </script>
</body>
</html>
