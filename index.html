<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日懿盲盒</title>
    <!-- 引入科技感字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
    <style>
        /* ========== 赛博朋克全局背景 ========== */
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            background-image: linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 4px;
            color: #0ff;
            font-family: 'Share Tech Mono', 'ZCOOL QingKe HuangYou', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .cyber-container {
            width: 100%;
            max-width: 700px;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        /* 故障风 (Glitch) 霓虹标题 */
        .cyber-title {
            font-size: 3rem;
            color: #fff;
            text-shadow: 0 0 5px #fff, 0 0 10px #ffb300, 0 0 20px #ffb300, 0 0 40px #0ff;
            margin-bottom: 40px;
            letter-spacing: 5px;
            position: relative;
            animation: glitch-anim 3s infinite;
        }

        @keyframes glitch-anim {
            0% { text-shadow: 2px 0 0 #ffb300, -2px 0 0 #0ff; }
            5% { text-shadow: -2px 0 0 #ffb300, 2px 0 0 #0ff; }
            10% { text-shadow: 2px 0 0 #ffb300, -2px 0 0 #0ff; }
            15% { text-shadow: 0 0 20px #ffb300, 0 0 40px #0ff; } 
            100% { text-shadow: 0 0 20px #ffb300, 0 0 40px #0ff; }
        }

        /* 赛博终端显示器 */
        .terminal-box {
            background: rgba(10, 20, 30, 0.85);
            border: 2px solid #0ff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4), inset 0 0 20px rgba(0, 255, 255, 0.2);
            padding: 40px 30px;
            position: relative;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%);
        }

        .terminal-box::before {
            content: "SYSTEM_MEMORY_ARCHIVE // SYS_ID: SY_001";
            position: absolute;
            top: 5px;
            left: 10px;
            font-size: 0.7rem;
            color: #ffb300;
            opacity: 0.8;
        }

        .text-display {
            font-size: 1.3rem;
            line-height: 1.8;
            color: #0ff;
            text-align: left;
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
            letter-spacing: 1px;
            word-wrap: break-word;
            width: 100%;
        }

        .cursor-block {
            display: inline-block;
            width: 12px;
            height: 1.2rem;
            background-color: #ffb300;
            margin-left: 5px;
            vertical-align: middle;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink { 50% { opacity: 0; } }

        /* 来源标签（剧名） */
        .source-tag {
            align-self: flex-end;
            margin-top: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffaa00; 
            text-shadow: 2px 2px 0px #000, -1px -1px 0px #000, 0 0 10px rgba(255, 170, 0, 0.6); 
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        /* 赛博朋克按钮 */
        .cyber-btn {
            background: transparent;
            color: #0ff;
            font-size: 1.2rem;
            border: 2px solid #0ff;
            padding: 15px 40px;
            margin-top: 40px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 3px;
            position: relative;
            transition: all 0.2s;
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
        }

        .cyber-btn:hover {
            background: #0ff;
            color: #000;
            box-shadow: 0 0 20px #0ff;
        }

        .cyber-btn:disabled {
            background: #333;
            color: #777;
            border-color: #555;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* 剩余记忆碎片指示器 */
        .counter {
            position: absolute;
            bottom: 10px;
            right: 15px;
            font-size: 0.8rem;
            color: #0ff;
            opacity: 0.5;
        }
    </style>
</head>
<body>

<div class="cyber-container">
    <h1 class="cyber-title">每日懿盲盒</h1>
    
    <div class="terminal-box">
        <div class="text-display">
            <span id="displayText">AWAITING_INPUT... 点击下方按钮调取记忆数据块。</span><span class="cursor-block" id="cursorBlock"></span>
        </div>
        <div class="source-tag" id="sourceTag">—— 《剧名》</div>
        <div class="counter" id="counterDisplay">AVAILABLE: 50/50</div>
    </div>

    <button class="cyber-btn" id="actionBtn" onclick="drawQuote()">
        ACCESS DATA // 抽取
    </button>
</div>

<script>
    // ========== 整理好的 50 句数据：戏文 + 两字出处 ==========
    const memories = [
        // 之前的 30 句
        { text: "滑腻,冰凉,绸从掌中的茧上滑过,像一条蛇。", source: "巾帼" },
        { text: "蜀使仍保持着双手奉上的动作,头颅低垂,我能感受到他视死如归的紧绷。", source: "巾帼" },
        { text: "隔着这层艳丽的布料,我摸到自己稳健的、充满生机的心跳。", source: "巾帼" },
        { text: "我就要穿着它,在坚不可摧的营垒里,看着你,直到死亡。", source: "巾帼" },
        { text: "鼓声起时,沉沉地压过满座喧哗。", source: "荣归" },
        { text: "故乡在身后,并不呼唤我,模糊、缄默,像一轮月沉入酒中。", source: "荣归" },
        { text: "洛阳的夜烧成一片红。朝堂没有了声音,城阙没有了轮廓,只有令人作呕的血气。", source: "梦魇" },
        { text: "火光深处,王凌披着焦黑的冠带,他不语,只是让火舌为之盘问。", source: "梦魇" },
        { text: "残躯、旧交、家国,以及穷极一生的一切,都从形骸中剥落,和这个加速崩塌的乱世一同沉入飞灰。", source: "梦魇" },
        { text: "光是极瘦的,奄奄一息地伏在墙角,什么也照不亮,只是把他的影子拖得很长。", source: "残光" },
        { text: "在这样近乎一无所有的贫瘠中,他仍将一切慷慨地给予我。", source: "残光" },
        { text: "声音像是从很深的水底浮上来的,斥候的嘴唇在火光中张合,像一条干涸的、濒死的鱼。", source: "秋夜" },
        { text: "他单方面的,没有一句告别的,独自把自己交给黑夜。太突兀了。", source: "秋夜" },
        { text: "我以为结局应是一场热烈的火,我们在阵前,在千军万马的嘶吼里,在天与地的震颤中,竭尽最后一滴心血。", source: "秋夜" },
        { text: "难道我期待着他的死亡?是的,不是,也许。", source: "秋夜" },
        { text: "天下易鼎只消一场水到渠成的礼仪。", source: "易鼎" },
        { text: "这是一场无声的寂灭,不闻惊雷。", source: "易鼎" },
        { text: "水气自芦花间漫起,如幕天席地的鲜缟。", source: "是非" },
        { text: "我的心被照得历历,在这片将暝未暝的天中。", source: "是非" },
        { text: "那些关于忠贞与奸恶的纠葛,在漫长的岁月里早已被磨蚀得只剩灰烬。", source: "是非" },
        { text: "我需要的是战栗、缄默,然后一个荒芜的时代。", source: "京观" },
        { text: "辽水的涛声渐远了。刀兵喑哑,甲叶无鸣,归途是沉默的。", source: "归途" },
        { text: "倚重或是堤备,君臣间,不过只是一念之差。", source: "托孤" },
        { text: "昔日袭人的明丽已不再,随青春陷入眼角的褶皱中。", source: "迟暮" },
        { text: "权柄已然不在,于是只能知老、知命,而后知退,以残躯自蔽,以蒙昧自全。", source: "迟暮" },
        { text: "人有好恶,但水从不辨忠奸,只是向东。惧在身后,不在眼前。", source: "东流" },
        { text: "天裂是不可弥合的,咫尺遂成天涯。", source: "火凤" },
        { text: "世人对男人的屈膝,向来是极尽宽宥的。他们将俯首奉为藏锋,缄口赞作韬晦。", source: "火凤" },
        { text: "繁忙的城市正在被灯火漂洗,而朦朦柔和的光落在你的侧脸上,我看不真切。", source: "现世" },
        { text: "早起时发现窗外飘雪了,天地一色,很好看。惦念着你回来的路,风大概是料峭的。", source: "冬信" },
        
        // 新增的 20 句
        { text: "我能听见粗重的喘息声,愤怒驱使着他们,于是切齿、咬牙,于是剑在鞘中激越地摩擦。", source: "巾帼" },
        { text: "我看见枯瘦的手,深陷的眼,然后是你,将绝望、不甘密密麻麻地缝进这件衣裳。", source: "巾帼" },
        { text: "冰冷的触感顺着脊背攀爬,它贴着我的皮肤,带着蜀地潮湿的瘴气。", source: "巾帼" },
        { text: "前面的是乡里父老,那些面孔大多已被岁月磨蚀松弛,眼角的褶皱深入沟壑。", source: "荣归" },
        { text: "我还能归家吗?还能在暮色四合时推开门,看见微明的烛火,听见妻子的呢喃吗?", source: "荣归" },
        { text: "病热使身体困锁,而灵魂已坠入燎原。", source: "梦魇" },
        { text: "火雾正在灼烧,我不能发声,于是竭力去握向虚空。只有灰烬,一掌灰烬。", source: "梦魇" },
        { text: "天子给他的太少,没有光,没有风,又遑论生路,或是一夜安枕。", source: "残光" },
        { text: "不闻惊雷,不见飞星,只有反复的、单调的秋虫鸣声。", source: "秋夜" },
        { text: "案上仍是他送来的衣裳,繁复的纹理在昏暗中如一摊扭曲的血。", source: "秋夜" },
        { text: "及至今日,我被魏臣之服,立于新朝坛下,眼见着旧主之玺归入另一双手。", source: "易鼎" },
        { text: "春秋之笔,向来如此,不论成败,只问是非。", source: "是非" },
        { text: "血肉的腥气黏膩地附着在甲片上,残躯与断臂,层层垒堆,和天边已堕的流星,筑起这座无言的高冢。", source: "京观" },
        { text: "昏矇的明灭中,苦药味沉在帷中,久久不散。", source: "托孤" },
        { text: "视线开始扭曲。某种滚烫的、尖锐的东西,在呼吸的边缘颤栗、悬浮。", source: "火凤" },
        { text: "起初是一层温热、咸湿的氤氲,极力克制下终究自眼底洇开。离开她,泪水于是冷了。", source: "火凤" },
        { text: "在细窄的缝隙中,我听见你的呼吸,感受到了掌心的纹路和熟悉的皂香。", source: "现世" },
        { text: "我们从大爆炸的余烬中走来,在短短的一生中相遇又告别。在浩瀚的尺度中,我们只是一瞬吗。", source: "星门" },
        { text: "这场突如其来的雨,竟然如此轻易地切断了现代人赖以生存的脐带。", source: "骤雨" },
        { text: "冰冷的光线总能轻易传达他的猜忌和乖戾,却永远无法承载真实的感受。", source: "骤雨" }
    ];

    // ========== 核心抽卡逻辑（防重复 + 来源缓冲机制） ==========
    
    let availableMemories = [...memories]; // 当前可抽取的卡池
    let recentSources = []; // 记录最近抽过的来源，用于冷却
    const BUFFER_SIZE = 2; // 冷却缓冲大小：连续几次内不会出现同剧目

    let isTyping = false;
    let typeInterval;

    function drawQuote() {
        if (isTyping) return;

        const textSpan = document.getElementById('displayText');
        const sourceTag = document.getElementById('sourceTag');
        const btn = document.getElementById('actionBtn');
        const counter = document.getElementById('counterDisplay');

        // 如果卡池抽空了，自动重新洗牌
        if (availableMemories.length === 0) {
            availableMemories = [...memories];
            recentSources = []; // 清空冷却记录
            alert("SYSTEM: 记忆数据库已全部遍历，正在重置索引...");
        }

        // 1. 核心过滤：筛选出“来源不在最近冷却列表里”的卡片
        let candidates = availableMemories.filter(m => !recentSources.includes(m.source));
        
        // 2. 兜底机制：如果严格过滤后没有可选的了（例如最后几张都是出自同一篇），则放宽限制
        if (candidates.length === 0) {
            candidates = availableMemories; // 强行解除冷却，抽取剩下的
        }

        // 3. 随机抽取
        const randomIndex = Math.floor(Math.random() * candidates.length);
        const targetMemory = candidates[randomIndex];

        // 4. 从可用卡池中删除这张卡
        const indexInAvailable = availableMemories.indexOf(targetMemory);
        availableMemories.splice(indexInAvailable, 1);

        // 5. 更新冷却列表
        recentSources.unshift(targetMemory.source);
        if (recentSources.length > BUFFER_SIZE) {
            recentSources.pop(); // 保持列表长度为 BUFFER_SIZE
        }

        // 6. 界面状态更新
        textSpan.innerHTML = '';
        sourceTag.style.opacity = '0'; 
        sourceTag.innerText = `—— 《${targetMemory.source}》`;
        counter.innerText = `AVAILABLE: ${availableMemories.length}/${memories.length}`;
        btn.disabled = true;
        btn.innerText = "DECRYPTING... // 解析中";
        isTyping = true;

        let charIndex = 0;
        const targetText = targetMemory.text;

        // 终端机打字特效
        typeInterval = setInterval(() => {
            textSpan.innerHTML += targetText.charAt(charIndex);
            charIndex++;

            if (charIndex >= targetText.length) {
                clearInterval(typeInterval);
                isTyping = false;
                
                // 打字结束，亮起来源标签
                sourceTag.style.opacity = '1';
                
                btn.disabled = false;
                btn.innerText = "ACCESS NEXT // 抽取下一个";
            }
        }, 50); 
    }
</script>

</body>
</html>
